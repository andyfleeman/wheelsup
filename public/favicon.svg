<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(198,40,40,0.55)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Dark background matching the login screen — no rx so it bleeds edge-to-edge for maskable icons -->
  <rect width="100" height="100" fill="#0f0f0f"/>
  <!-- Hex nut shape — inset from edges so it's visible at all sizes -->
  <polygon points="50,10 84,29 84,71 50,90 16,71 16,29" fill="url(#hex)" filter="url(#glow)"/>
  <!-- Inner hex ring (nut socket detail) -->
  <polygon points="50,22 71,34 71,66 50,78 29,66 29,34" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- K — same proportions as the login logo -->
  <path d="M35 26 L35 74 M35 50 L57 26 M35 50 L60 74"
        stroke="white" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
